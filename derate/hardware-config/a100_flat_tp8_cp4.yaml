sw_param:
  full_recomputation: true
  kernel_launch_overhead: 9e-6
  dp_zero_stage: 1
  precision:
    tensor_format: bf16
    mixed_precision: false
    param_storage_mode: as_tensor_format
    kv_cache: as_tensor_format
  h2d_bandwidth: -1

tech_param:
  core:
    operating_frequency: 1.41e9
    num_bundles: 108
    nominal_flop_rate_per_mcu: 512
    nominal_energy_per_flop: 1.8e-13
    num_mcu_per_bundle: 4
    FMA_d1: 8
    FMA_d2: 4
    dataflow: best
    util: 1.0
  DRAM:
    size: 80 GB
    bandwidth: 1986 GB
    dynamic_energy_per_bit: 4.5e-12
    latency: 100e-9
    util: 1
  SRAM-L2:
    size: 40 MB
    bandwidth: 7050 GB
    dynamic_energy_per_bit: 130e-15
    latency: 0
    util: 1
  SRAM-L1:
    size: 20736 KB
    bandwidth: 18 TB
    dynamic_energy_per_bit: 130e-15
    latency: 0
    util: 1
  SRAM-R:
    size: 27 MB
    bandwidth: 122 TB
    dynamic_energy_per_bit: 110e-15
    latency: 0
    util: 1

memory_hierarchy:
  l0:
    type: SRAM-R
    scope: mcu
  l1:
    type: SRAM-L1
    scope: mcu-bundle
  l2:
    type: SRAM-L2
    scope: global
  l3:
    type: DRAM
    scope: global

parallelism:
  dp: 1
  tp: 9
  tp_sp: false
  cp: 4
  lp: 1
  mb: 1

network:
  overlap:
    tp_overlap: 0.6
    tp_sp_overlap: 0.63
    cp_overlap: 1.0
  dimensions:
    - id: dim0
      label: mesh2d_tp_cp
      size: auto
      topology:
        type: Mesh2D
        bandwidth: 100 GB
        latency: 5e-6
        energy_per_bit: 8e-12
        util: 1.0
        optimize_2dmap: false
      collective_override: {}
      parallelisms: [tp, cp]

execution_backend:
  model: astra
  astra:
    backend: astra
    mode: full_astrasim_flattened
    collectives:
      all_gather: auto
      all_reduce: auto
      reduce_scatter: auto
      all_to_all: auto
    sys_options:
      endpoint_delay: 5
      active_chunks_per_dimension: 32
      preferred_dataset_splits: 4

inference:
  kvcache_type: hbm_only
