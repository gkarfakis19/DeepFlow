[project]
name = "deepflow"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flash-attn>=2.8.3",
    "graphviz>=0.21",
    "joblib>=1.5.2",
    "matplotlib>=3.10.6",
    "numpy==2.3.3",
    "packaging>=25.0",
    "pandas==2.3.1",
    "protobuf==5.28.2",
    "pydot>=3.0.0",
    "python-dateutil==2.9.0.post0",
    "pytz==2025.2",
    "pyyaml==6.0.2",
    "ruamel-yaml==0.17.40",
    "ruamel-yaml-clib==0.2.8",
    "setuptools>=80.9.0",
    "six==1.17.0",
    "sympy>=1.14.0",
    "torch>=2.4.1",
    "torchaudio>=2.4.1",
    "torchvision>=0.19.1",
    "tqdm>=4.67.1",
    "transformers>=4.57.1",
    "tzdata==2025.2",
    "xformers>=0.0.28.post1",
]

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }
torchaudio = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
